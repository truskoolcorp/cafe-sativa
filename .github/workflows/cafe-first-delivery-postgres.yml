name: First Café delivery pair PostgreSQL 17
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cafe-first-delivery-postgres.yml'
      - 'lib/content/character-promo-cafe-first-delivery*.ts'
      - 'lib/content/character-promo-cafe-initial-editorial*.ts'
      - 'lib/content/character-promo-cafe-initial-standing*.ts'
      - 'tests/character-promo-cafe-first-delivery*.test.cjs'
      - 'tests/character-promo-cafe-initial-editorial*.test.cjs'
      - 'tests/character-promo-cafe-initial-standing*.test.cjs'
      - 'docs/proposals/character-production-qa-*.sql'
      - 'docs/proposals/character-production-planner*.sql'
      - 'docs/proposals/character-production-scheduler-principal.sql'
      - 'docs/proposals/cafe-standing-publication-authority.sql'
      - 'docs/proposals/cafe-first-delivery-plans.sql'
      - 'docs/proposals/cafe-publication-targets.sql'
      - 'docs/proposals/character-production-binding-snapshots.sql'
      - 'docs/proposals/character-production-replenishment.sql'
      - 'docs/proposals/cafe-metricool-store.sql'
      - 'docs/proposals/cafe-metricool-authority-writer.sql'
      - 'tests/postgres/*.py'
      - 'scripts/prepare-*-install.py'
      - 'docs/proposals/character-production-receipt-evidence.sql'
      - 'scripts/prepare-planner-admin-install.py'
      - 'docs/proposals/character-production-admin-bridge*.sql'
      - 'tests/postgres/validate_planner_install.py'
      - 'docs/proposals/character-production-heygen*'
      - 'tests/postgres/validate_qa_install.py'
      - 'tests/postgres/validate_qa_recurring_install.py'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: character_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d character_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: character_ci_test
      PG_DISPOSABLE_TEST_CONFIRM: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node --test tests/character-promo-cafe-first-delivery*.test.cjs tests/character-promo-cafe-initial-editorial*.test.cjs tests/character-promo-cafe-initial-standing*.test.cjs
      - run: node node_modules/typescript/bin/tsc --project tsconfig.json --strict --noEmit --incremental false
      - name: Install official PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify bound saved text, QA and atomic plan pair
        run: python3 tests/postgres/validate_cafe_first_delivery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-delivery-postgres-evidence
          path: evidence/postgres-*-validation.log

