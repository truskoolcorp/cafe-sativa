name: Cafe Metricool isolated PostgreSQL
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cafe-metricool-postgres.yml'
      - 'docs/proposals/cafe-metricool-authority-writer.sql'
      - 'docs/proposals/cafe-metricool-authority-install.sql'
      - 'scripts/prepare-cafe-metricool-authority-install.py'
      - 'tests/sql/cafe-authority-installed-baseline.json'
      - 'tests/postgres/validate_cafe_authority_install.py'
      - 'scripts/prepare-cafe-dispatch-capability-grant.py'
      - 'docs/proposals/cafe-dispatch-capability-grant.sql'
      - 'tests/sql/cafe-capability-installed-baseline.json'
      - 'tests/postgres/validate_cafe_dispatch_capability.py'
      - 'scripts/prepare-scheduler-capability-grant.py'
      - 'scripts/prepare-enrolled-runtime-capability-grant.py'
      - 'docs/proposals/cafe-authenticated-owner-authority.sql'
      - 'tests/postgres/validate_cafe_authenticated_owner.py'
      - 'docs/proposals/cafe-metricool-store.sql'
      - 'docs/proposals/cafe-metricool-external-identity-repair.sql'
      - 'tests/postgres/validate_cafe_external_identity_repair.py'
      - 'docs/proposals/cafe-metricool-install.sql'
      - 'scripts/prepare-cafe-metricool-install.py'
      - 'tests/postgres/validate_cafe_metricool_install.py'
      - 'tests/postgres/validate_cafe_metricool.py'
      - 'lib/content/character-promo-cafe-store.ts'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: character_ci_metricool
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d character_ci_metricool"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: character_ci_metricool
      PG_DISPOSABLE_TEST_CONFIRM: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install official PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate isolated authority, concurrent reservations and receipts
        run: python3 tests/postgres/validate_cafe_metricool.py
      - name: Validate non-superuser production-like RLS installer
        run: python3 tests/postgres/validate_cafe_metricool_install.py
      - name: Validate exact negative-only external identity repair
        run: python3 tests/postgres/validate_cafe_external_identity_repair.py
      - name: Validate four dispatch capabilities after negative-only repair
        run: python3 tests/postgres/validate_cafe_dispatch_capability.py
      - name: Validate exact authenticated owner finite authority
        run: python3 tests/postgres/validate_cafe_authenticated_owner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cafe-metricool-postgres-evidence
          path: |
            evidence/postgres-cafe-metricool*-validation.log
            evidence/postgres-cafe-external-identity-repair.log
            evidence/postgres-cafe-dispatch-capability.log
            evidence/postgres-cafe-authenticated-owner.log

