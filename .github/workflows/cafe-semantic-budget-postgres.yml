name: Cafe semantic budget disposable PostgreSQL
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/proposals/cafe-semantic-budget.sql'
      - 'tests/postgres/validate_cafe_semantic_budget.py'
      - '.github/workflows/cafe-semantic-budget-postgres.yml'
      - 'lib/content/character-promo-cafe-semantic-*.ts'
      - 'tests/character-promo-cafe-semantic-review.test.cjs'
permissions:
  contents: read
jobs:
  semantic-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable
          POSTGRES_DB: character_ci_semantic
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable
      PGDATABASE: character_ci_semantic
      PG_DISPOSABLE_TEST_CONFIRM: 'yes'
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/postgres/validate_cafe_semantic_budget.py
