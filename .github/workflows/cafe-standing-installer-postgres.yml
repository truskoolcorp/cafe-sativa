name: Cafe standing installer rehearsal PostgreSQL 17
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cafe-standing-installer-postgres.yml'
      - 'docs/proposals/character-production-qa-*.sql'
      - 'docs/proposals/character-production-planner*.sql'
      - 'docs/proposals/character-production-scheduler-principal.sql'
      - 'docs/proposals/cafe-standing-publication-authority.sql'
      - 'docs/proposals/cafe-metricool-store.sql'
      - 'docs/proposals/cafe-metricool-authority-writer.sql'
      - 'tests/postgres/*.py'
      - 'scripts/prepare-*-install.py'
      - 'scripts/cafe-standing-catalog.sql'
      - 'scripts/derive-cafe-standing-expected.py'
      - 'tests/scripts/test_cafe_standing_expected.py'
      - 'docs/proposals/cafe-semantic-budget.sql'
      - 'docs/proposals/character-production-receipt-evidence.sql'
      - 'scripts/prepare-planner-admin-install.py'
      - 'docs/proposals/character-production-admin-bridge*.sql'
      - 'tests/postgres/validate_planner_install.py'
      - 'docs/proposals/character-production-heygen*'
      - 'tests/postgres/validate_qa_install.py'
      - 'tests/postgres/validate_qa_recurring_install.py'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: character_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d character_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: character_ci_test
      PG_DISPOSABLE_TEST_CONFIRM: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate private delta helper
        run: python3 -m unittest discover -s tests/scripts -p test_cafe_standing_expected.py
      - name: Validate catalog, rollback, drift and six-plus-four grants
        run: python3 tests/postgres/validate_cafe_standing_installer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cafe-standing-installer-postgres-evidence
          path: evidence/postgres-*-validation.log
