name: Canonical still preview fallback
on:
  pull_request:
    paths:
      - 'tools/render_canonical_still_preview.py'
      - 'tests/test_canonical_still_fallback.py'
      - '.github/workflows/canonical-still-fallback.yml'
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_canonical_still_fallback.py' -v
      - run: python3 -m py_compile tools/render_canonical_still_preview.py
