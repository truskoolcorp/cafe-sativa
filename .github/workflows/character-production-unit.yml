name: Character production disabled-engine regression
on:
  pull_request:
    paths:
      - 'lib/content/character-production-*.ts'
      - 'lib/content/character-promo-sources.ts'
      - 'lib/content/character-promo-cafe-*.ts'
      - 'tests/character-promo-cafe-*.test.cjs'
      - 'lib/content/character-promo-external-receipts.ts'
      - 'tests/character-promo-external-receipts.test.mjs'
      - 'lib/content/character-promo-cafe-authenticated-transport.ts'
      - 'tests/character-promo-cafe-authenticated-transport.test.cjs'
      - 'lib/content/character-promo-cafe-owner-preview-server.ts'
      - 'lib/content/character-promo-cafe-editorial-from-plan.ts'
      - 'tests/character-promo-cafe-owner-preview.test.cjs'
      - 'app/api/admin/character-promotions/cafe-owner-preview/route.ts'
      - 'app/admin/character-promotions/cafe-owner-preview/**'
      - 'lib/content/character-promo-cafe-authority-server.ts'
      - 'lib/content/character-promo-cafe-approval.ts'
      - 'lib/content/character-promo-cafe-owner-policy.ts'
      - 'lib/content/character-promo-cafe-sources-server.ts'
      - 'tests/character-promo-cafe-authority-server.test.cjs'
      - 'tests/character-promo-cafe-metricool.test.cjs'
      - 'tests/character-production-*.mjs'
      - 'tests/character-production-recurring-*-server.test.cjs'
      - 'tests/character-production-selected-*.test.cjs'
      - 'tests/character-production-replenishment*.test.cjs'
      - 'tests/character-production-zaria-text-limit.test.cjs'
      - 'tests/character-production-private-test-handler.test.cjs'
      - 'tests/character-production-preparation-server.test.cjs'
      - 'app/admin/private-preparation-test/**'
      - 'app/api/admin/character-promotions/private-preparation-test/**'
      - 'tests/character-production-fresh-speech*.test.cjs'
      - 'docs/proposals/character-production-*.sql'
      - '.github/workflows/character-production-unit.yml'
      - 'scripts/prepare-cafe-standing-install.py'
      - 'scripts/cafe-standing-catalog.sql'
      - 'tests/scripts/test_cafe_standing_install.py'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: chmod u+x node_modules/@ffprobe-installer/linux-x64/ffprobe
      - run: python3 -m unittest discover -s tests/scripts -p test_cafe_standing_install.py
      - run: node --test tests/character-production-private-test-handler.test.cjs tests/character-production-preparation-server.test.cjs tests/character-production-zaria-text-limit.test.cjs tests/character-production-fresh-speech*.test.cjs tests/character-production-replenishment*.test.cjs tests/character-production-selected-*.test.cjs tests/character-production-recurring-*-server.test.cjs tests/character-promo-cafe-*.test.cjs tests/character-production-*.test.mjs tests/character-promo-external-receipts.test.mjs
      # Server composition intentionally uses the existing Next backend and @/
      # aliases. Keep strict checking, with the actual deployment project config.
      - run: node node_modules/typescript/bin/tsc --project tsconfig.json --strict --noEmit --incremental false



