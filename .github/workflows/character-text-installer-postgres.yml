name: Character text installer PostgreSQL 17
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/character-text-installer-postgres.yml'
      - 'scripts/prepare-character-text-install.py'
      - 'scripts/prepare-cafe-standing-install.py'
      - 'scripts/cafe-standing-catalog.sql'
      - 'docs/proposals/character-production-replenishment.sql'
      - 'tests/postgres/validate_character_text_installer.py'
      - 'tests/postgres/validate_ledger.py'
      - 'tests/scripts/test_character_text_install.py'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: character_ci_test
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d character_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: supabase_admin
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: character_ci_test
      PG_TEST_SERVER: '1'
      PG_DISPOSABLE_TEST_CONFIRM: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install official PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate rollback generator
        run: python3 -m unittest discover -s tests/scripts -p test_character_text_install.py
      - name: Verify exact isolated role and catalog restoration
        run: python3 tests/postgres/validate_character_text_installer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-text-installer-evidence
          path: evidence/postgres-*-validation.log
