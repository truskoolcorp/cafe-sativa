name: Concierge launch and session readiness
on:
  pull_request:
    paths:
      - 'app/api/concierge/**'
      - 'app/ask/**'
      - 'app/layout.tsx'
      - 'app/fonts.css'
      - 'public/fonts/**'
      - 'lib/concierge/**'
      - 'lib/lounge-membership.ts'
      - 'lib/cors.ts'
      - 'lib/events/hit-em-premiere.ts'
      - 'tests/concierge*.cjs'
      - 'tests/conversation*.cjs'
      - 'tests/hit-em-premiere.test.cjs'
      - 'tests/lounge-membership.test.cjs'
      - 'tests/site-fonts.test.cjs'
      - '.github/workflows/concierge-launch-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/concierge*.cjs tests/conversation*.cjs tests/hit-em-premiere.test.cjs tests/lounge-membership.test.cjs tests/site-fonts.test.cjs
      - run: npx tsc --noEmit --incremental false
