name: Concierge launch readiness
on:
  pull_request:
    paths:
      - 'app/api/concierge/route.ts'
      - 'lib/concierge/**'
      - 'lib/events/hit-em-premiere.ts'
      - 'tests/concierge*.cjs'
      - 'tests/conversation*.cjs'
      - 'tests/hit-em-premiere.test.cjs'
      - '.github/workflows/concierge-launch-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/concierge*.cjs tests/conversation*.cjs tests/hit-em-premiere.test.cjs
