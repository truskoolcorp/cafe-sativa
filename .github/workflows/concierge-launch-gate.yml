name: Concierge launch and session readiness
on:
  pull_request:
    paths:
      - 'app/api/concierge/**'
      - 'app/ask/**'
      - 'app/layout.tsx'
      - 'app/fonts.css'
      - 'public/fonts/**'
      - 'lib/concierge/**'
      - 'lib/lounge-membership.ts'
      - 'lib/cors.ts'
      - 'lib/events/hit-em-premiere.ts'
      - 'tests/*.cjs'
      - 'tests/concierge*.cjs'
      - 'tests/conversation*.cjs'
      - 'tests/hit-em-premiere.test.cjs'
      - 'tests/lounge-membership.test.cjs'
      - 'tests/site-fonts.test.cjs'
      - 'tests/fixtures/mall-concierge-transport.mjs'
      - 'tests/helpers/concierge-harness.cjs'
      - 'tests/db/**'
      - 'tests/auth-service/**'
      - 'supabase/migrations/20261108090000_durable_concierge_admission.sql'
      - '.github/workflows/concierge-launch-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.cjs
      - run: npx tsc --noEmit --incremental false
  isolated-database:
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17.6', '17.11']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-local-ci-only
          POSTGRES_DB: concierge_isolated_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d concierge_isolated_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: synthetic-local-ci-only
      PGDATABASE: concierge_isolated_test
      CAFE_DISPOSABLE_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/db -p 'test_*.py' -v
      - run: python3 tests/db/run.py --bootstrap

  isolated-auth-service:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CAFE_DISPOSABLE_AUTH: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests/auth-service -p 'test_*.py' -v
      - run: bash tests/auth-service/run-ci.sh
