name: Owner-only enrolled reads installer PostgreSQL 17
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/enrolled-reads-install-postgres.yml'
      - 'docs/proposals/character-production-*.sql'
      - 'scripts/prepare-*-install.py'
      - 'tests/postgres/*.py'
      - 'tests/fixtures/character-production-*.sql'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: character_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d character_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: character_ci_test
      PG_DISPOSABLE_TEST_CONFIRM: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate planner rollback restricted roles and concurrency
        run: python3 tests/postgres/validate_enrolled_reads_install.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enrolled-reads-install-postgres-evidence
          path: evidence/postgres-*-validation.log
