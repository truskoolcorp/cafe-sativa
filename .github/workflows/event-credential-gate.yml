name: Event credential redaction gate
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261019_redact_event_join_credentials.sql'
      - 'tests/meeting-credential-redaction.test.cjs'
      - 'tests/event-join-api.test.cjs'
      - 'tests/event-join-behavior.test.cjs'
      - 'app/api/events/**'
      - 'app/events/**'
      - '.github/workflows/event-credential-gate.yml'
  workflow_dispatch:
jobs:
  source-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node --test tests/meeting-credential-redaction.test.cjs tests/event-join-api.test.cjs tests/event-join-behavior.test.cjs
