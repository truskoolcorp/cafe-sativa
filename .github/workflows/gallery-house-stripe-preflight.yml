name: Gallery Stripe sandbox readiness only
on:
  pull_request:
    types: [labeled]
    branches: [feature/gallery-web3-preview]
permissions:
  contents: read
jobs:
  one-shot-sandbox-readiness:
    if: >-
      github.repository == 'truskoolcorp/cafe-sativa' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'qa/gallery-house-stripe-preflight-20261124' &&
      github.event.pull_request.draft == true &&
      github.event.label.name == format('sha-{0}', github.event.pull_request.head.sha) &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify throwaway sandbox authorization (no checkout)
        env:
          GALLERY_QA_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tests/gallery-house-stripe-preflight.mjs
