name: Password recovery gate
on:
  pull_request:
    paths:
      - 'app/auth/signin/**'
      - 'app/auth/reset/**'
      - 'tests/password-recovery.test.cjs'
      - '.github/workflows/password-recovery-gate.yml'
  workflow_dispatch:
jobs:
  recovery:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/password-recovery.test.cjs
      - run: npx tsc --noEmit
