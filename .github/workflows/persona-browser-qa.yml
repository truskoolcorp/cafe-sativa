name: Persona browser QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install isolated official Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/persona-playwright" --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.56.1
          node "$RUNNER_TEMP/persona-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Build fixture from this checkout
        run: |
          mkdir -p .persona-browser-evidence
          node node_modules/tailwindcss/lib/cli.js -c tailwind.config.js -i tests/browser/persona/fixture.css -o .persona-browser-evidence/static.css --minify
          node tests/browser/persona/build-static.cjs
      - name: Exercise synthetic UI with all browser network aborted
        env:
          NODE_PATH: ${{ runner.temp }}/persona-playwright/node_modules
        run: node tests/browser/persona/browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-browser-evidence
          path: .persona-browser-evidence/
          retention-days: 7
