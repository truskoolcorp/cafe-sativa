name: Persona plan controls (isolated SQL)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/proposals/persona-*.sql'
      - 'tests/sql/persona-plan*'
      - 'tests/sql/persona-ledger-fixture.sql'
      - 'tests/sql/persona-gates-seed.sql'
      - 'supabase/migrations/20261020154000_character_canon_spoken_promos.sql'
      - 'supabase/migrations/20261020173000_character_promo_qa_checks.sql'
      - 'supabase/migrations/20261021103000_decouple_promo_script_approval_from_audio.sql'
      - 'tests/sql/run-persona-withdrawal-ci.sh'
      - '.github/workflows/persona-plan-controls-proposal.yml'
permissions:
  contents: read
jobs:
  postgres-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-fixture-only
    steps:
      - uses: actions/checkout@v4
      - name: Run actual PostgreSQL fixtures without application secrets
        run: bash tests/sql/run-persona-withdrawal-ci.sh
