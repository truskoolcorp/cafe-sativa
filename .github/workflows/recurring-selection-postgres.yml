name: Dormant recurring selection PostgreSQL 17
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/recurring-selection-postgres.yml'
      - 'docs/proposals/character-production-recurring-selection.sql'
      - 'tests/postgres/validate_recurring_selection.py'
      - 'docs/proposals/character-production-scheduler-principal.sql'
      - 'docs/proposals/character-production-enrolled-*.sql'
      - 'docs/proposals/character-production-qa-*.sql'
      - 'docs/proposals/character-production-planner*.sql'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: character_ci_recurring
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d character_ci_recurring"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: character_ci_recurring
      PG_TEST_SERVER: '1'
      PG_DISPOSABLE_TEST_CONFIRM: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install official PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify owner-only durable selection and no paid-state mutation
        run: python3 tests/postgres/validate_recurring_selection.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recurring-selection-postgres-evidence
          path: evidence/postgres-*-validation.log
