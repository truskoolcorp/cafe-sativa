name: Dormant scoped bound planner PostgreSQL 17
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/scheduler-plan-bound-postgres.yml'
      - 'docs/proposals/character-production-binding-snapshots.sql'
      - 'docs/proposals/character-production-scheduler-plan-bound.sql'
      - 'tests/postgres/validate_binding_snapshot.py'
      - 'tests/postgres/validate_scheduler_plan_bound.py'
      - 'docs/proposals/character-production-recurring-selection.sql'
      - 'docs/proposals/character-production-scheduler-principal.sql'
      - 'lib/content/character-production-binding-snapshot.ts'
      - 'tests/character-production-binding-snapshot.test.cjs'
      - 'lib/content/character-production-planner-*.ts'
      - 'tests/character-production-planner-bound-entry.test.mjs'
      - 'docs/proposals/character-production-enrolled-*.sql'
      - 'docs/proposals/character-production-qa-*.sql'
      - 'docs/proposals/character-production-planner*.sql'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: character_ci_replenishment
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d character_ci_replenishment"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: character_ci_replenishment
      PG_TEST_SERVER: '1'
      PG_DISPOSABLE_TEST_CONFIRM: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node --test tests/character-production-binding-snapshot.test.cjs tests/character-production-planner-bound-entry.test.mjs
      - run: node node_modules/typescript/bin/tsc --project tsconfig.json --strict --noEmit --incremental false
      - name: Install official PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify scoped atomic planner, revocation and no runtime grants
        run: python3 tests/postgres/validate_scheduler_plan_bound.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduler-plan-bound-postgres-evidence
          path: evidence/postgres-*-validation.log
