name: Historical social receipt eligibility
on:
  pull_request:
    paths:
      - 'lib/content/social-*.ts'
      - 'app/api/content/social/delivery/route.ts'
      - 'tests/social-receipts.test.cjs'
      - '.github/workflows/social-receipt-eligibility.yml'
permissions:
  contents: read
jobs:
  receipt-eligibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/social-receipts.test.cjs tests/social-oauth-reconnect-guard.test.cjs
