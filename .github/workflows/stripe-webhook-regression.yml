name: Stripe webhook offline regression
on:
  pull_request:
    paths:
      - 'app/api/webhooks/stripe/route.ts'
      - 'app/api/membership/refresh/route.ts'
      - 'lib/sync-membership.ts'
      - 'lib/membership-prices.ts'
      - 'tests/*membership*'
      - 'tests/stripe-*'
      - 'tests/gallery-*'
      - 'tests/fixtures/gallery-local-house-base.sql'
      - 'tests/helpers/load-gallery-environment.cjs'
      - 'app/api/gallery/**'
      - 'lib/gallery/**'
      - 'docs/gallery/*.sql'
      - '.github/workflows/stripe-webhook-regression.yml'
  push:
    branches: [main]
    paths:
      - 'app/api/webhooks/stripe/route.ts'
      - 'app/api/membership/refresh/route.ts'
      - 'lib/sync-membership.ts'
      - 'lib/membership-prices.ts'
      - 'tests/*membership*'
      - 'tests/stripe-*'
      - 'tests/gallery-*'
      - 'tests/fixtures/gallery-local-house-base.sql'
      - 'tests/helpers/load-gallery-environment.cjs'
      - 'app/api/gallery/**'
      - 'lib/gallery/**'
      - 'docs/gallery/*.sql'
      - '.github/workflows/stripe-webhook-regression.yml'
  workflow_dispatch:
jobs:
  stripe-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/stripe-webhook-regression.test.cjs tests/membership-sync.test.cjs
      - run: node tests/stripe-entitlements.cjs
      - run: node tests/membership-refresh.cjs
      - run: node --test tests/gallery-environment.test.mjs tests/gallery-checkout.cjs tests/gallery-download.test.cjs tests/gallery-settlement.test.cjs tests/gallery-financial-review.test.cjs
      - run: node tests/gallery-house-sandbox-prep.mjs --self-test
      - run: node tests/gallery-house-local-driver.mjs --self-test
      - name: Disposable Gallery PostgreSQL migration and private consignment fixture
        run: bash tests/gallery-consigned-private-postgres.sh
