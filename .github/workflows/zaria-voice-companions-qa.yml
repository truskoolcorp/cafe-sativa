name: Zaria browser companion links QA
on:
  pull_request:
    paths:
      - 'lib/concierge/live-voice-client.ts'
      - 'components/LiveVoiceConversation.tsx'
      - 'tests/zaria-voice-companions.test.cjs'
      - '.github/workflows/zaria-voice-companions-qa.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/zaria-voice-companions.test.cjs
      - run: npx tsc --noEmit
