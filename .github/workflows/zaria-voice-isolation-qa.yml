name: Zaria preview voice isolation QA
on:
  pull_request:
    paths:
      - 'app/api/concierge/livekit/session/route.ts'
      - 'lib/gallery/zaria-voice-v1.ts'
      - 'tests/gallery-zaria.test.cjs'
      - '.github/workflows/zaria-voice-isolation-qa.yml'
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/gallery-zaria.test.cjs tests/zaria-voice-companions.test.cjs
      - run: node node_modules/typescript/bin/tsc --noEmit
